<main class="desktop" aria-label="Portfolio desktop">
  <div class="wallpaper" aria-hidden="true"></div>
  <nav class="desktop-icons" aria-label="Explore my portfolio">
    <button class="desktop-icon" data-app="about"><svg><use href="#i-about"/></svg><span>About Me</span></button>
    <button class="desktop-icon" data-app="projects"><svg><use href="#i-projects"/></svg><span>Projects</span></button>
    <button class="desktop-icon" data-app="terminal"><svg><use href="#i-terminal"/></svg><span>Terminal</span></button>
    <button class="desktop-icon" data-app="resume"><svg><use href="#i-resume"/></svg><span>Resume</span></button>
    <button class="desktop-icon" data-app="contact"><svg><use href="#i-contact"/></svg><span>Contact</span></button>
    <div class="music-folder"><button id="music-folder-button" class="desktop-icon" data-app="music" aria-expanded="false" aria-controls="music-papers"><svg><use href="#i-music"/></svg><span>Music</span></button>
      <div id="music-papers" class="music-papers" aria-label="Inside the music folder" hidden>
        <a class="paper-choice instrument-paper" href="instruments.html"><span class="paper-symbol" aria-hidden="true">♬</span><span class="paper-lines" aria-hidden="true"></span><strong>Instruments</strong><small>the things I play ↗</small></a>
        <a class="paper-choice track-paper" href="tracks.html"><span class="paper-symbol" aria-hidden="true">♫</span><span class="paper-lines" aria-hidden="true"></span><strong>Music Tracks</strong><small>the sounds I make ↗</small></a>
      </div>
    </div>
    <button class="desktop-icon travel-folder" data-app="travel"><svg><use href="#i-travel"/></svg><span>Travel With Me</span></button>
  </nav>
  <section class="welcome" aria-label="Welcome"><p>hi, welcome to my little<br>corner of the internet! ♡</p><span class="tiny-star" aria-hidden="true">✧</span></section>
  <aside class="clock-widget" aria-label="Current date and time"><span id="date"></span><time id="widget-time"></time></aside>
  <button class="sticky-note" data-app="about" aria-label="Read more about me"><span class="pin" aria-hidden="true"></span><span>a little space for<br>things I make,<br>things I learn,<br>and everything<br>in between ♡</span><span class="cat-doodle" aria-hidden="true">／ᐠ｡ꞈ｡ᐟ＼</span></button>
  <p class="desktop-hint">make yourself at home <span>↖</span></p>
</main>
<section id="start-menu" class="start-menu" aria-label="Start menu" hidden>
  <p class="menu-eyebrow">WELCOME TO MY LITTLE CORNER</p><h2>Stay a little while ♡</h2>
  <div id="menu-apps"></div><p id="no-results" hidden>No windows found. Try “projects”.</p>
  <footer><span class="status-dot"></span> a work in progress, like all good things</footer>
</section>
<footer class="taskbar">
  <button id="start-button" class="start-button" aria-expanded="false" aria-controls="start-menu"><svg><use href="#i-star"/></svg><span>Start</span></button>
  <label class="search"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="Type something…" aria-label="Find a portfolio window" autocomplete="off"></label>
  <button id="active-app" class="active-app" hidden></button>
  <div class="system-tray"><svg class="wifi" aria-label="Cozy and connected" role="img"><use href="#i-wifi"/></svg><button id="sound-button" title="Turn ambient sound on" aria-label="Turn ambient sound on" aria-pressed="false">♫<span class="sound-off">×</span></button><time id="tray-time"></time><span class="battery" aria-label="Fully charged" role="img"><i></i></span></div>
</footer>
<dialog id="app-window" aria-labelledby="window-title">
  <header class="window-bar"><div><svg id="window-icon"><use href="#i-about"/></svg><span id="window-title"></span></div><div class="window-controls"><button id="minimize" aria-label="Minimize window">−</button><button id="close-window" aria-label="Close window">×</button></div></header>
  <div id="window-content" class="window-content"></div>
</dialog>
